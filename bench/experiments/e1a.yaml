# E1a, reproduction (a): producer throughput without and with batching (Kreps et al. 2011, Figure 4).
# Runs Kafka's own kafka-producer-perf-test inside kafka-1 against `perf_test` (1 partition, RF 1).
# The paper counts batches in messages; the Java producer's batch.size is in bytes. Each setting's
# batch.size is (messages x 200 bytes); per-record overhead means a batch holds slightly fewer.
# Re-read the paper's setup before the full run and log any deviation in docs/decisions.md (T25).
params:
  repeats: 3
  num_records: 2000000
  record_size: 200          # bytes, as in the paper
  acks: 1
dry_run:
  num_records: 100000
settings:
  - {id: no-batching, batch_size: 0, linger_ms: 0}
  - {id: batch-10, batch_size: 2000, linger_ms: 10}
  - {id: batch-50, batch_size: 10000, linger_ms: 10}
  - {id: batch-100, batch_size: 20000, linger_ms: 10}
  - {id: batch-200, batch_size: 40000, linger_ms: 10}
